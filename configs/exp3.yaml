# Эксперимент 3: нагрузка (4 слота). Пределы интерактивности заданы ДО опыта (см. hypothesis.md).
experiment: lr1
series: exp3_load
prompt_tokens: 1024
max_tokens: 128
concurrency_levels: [1, 2, 4]
min_requests: 16                  # запросов на уровень: max(16, 4c)
limits:
  ttft_p90_s: 60.0                # TTFT у 90 % запросов не больше 60 с (запрос 1024 токенов на CPU)
  tpot_median_s: 0.30             # медиана TPOT не больше 0,30 с (около 3,3 токена/с — нижняя граница скорости чтения)
server_slots: 4
